# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Mod properties
mod_version = 3.1.1.001
maven_group = com.berserker
archives_name = berserker_rpg
enabled_platforms = fabric,forge

# Minecraft properties
minecraft_version = 1.20.1
minecraft_compat_version = 1.20.1
yarn_mappings = 1.20.1+build.1

# Dependencies
fabric_loader_version = 0.19.5
# Oldest loader this mod actually runs on. NOT the build version above -
# driving the manifest from that would over-declare the requirement.
fabric_loader_compat_version=0.14.21
fabric_api_version = 0.92.12+1.20.1
forge_version = 1.20.1-47.4.22
cloth_config_version=11.1.106
# Not used in code; Spell Engine requires it at runtime, so it is a dev-runtime pin only.
player_anim_version=1.0.2+1.19.4
spell_power_version=1.6.0.002+1.20.1
tiny_config_version=3.1.0.001
mixin_extras_version=0.5.5
armor_model_api_version=1.0.0.001+1.20.1
spell_engine_version=1.10.5.017+1.20.1
more_rpg_library_version=2.7.2.005+1.20.1
# Dev-runtime only. Not referenced from Java: More RPG Library ships rune-altar recipes of type
# `runes:crafting`, and its Dragonslayer's Fury effect names `critical_strike:damage` - without these two
# on the dev classpath the dedicated server logs 8 recipe parse errors and an attribute-resolve failure.
# Critical Strike also makes the crit-conditional armor set bonuses in `Armors` live in dev.
runes_version=1.3.2.001+1.20.1
critical_strike_version=1.0.4.002

# Fabric only (dev runtime pins)
trinkets_version=3.7.2
cardinal_components_version=5.2.0

# Forge only (dev runtime pin)
curios_version=5.14.1+1.20.1
